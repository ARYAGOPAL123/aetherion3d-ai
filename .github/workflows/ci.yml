name: Depth-Guard CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run tests
        run: python -B -m unittest discover -s tests

      - name: Evaluate challenge output
        run: python -B scripts/evaluate_submission.py

      - name: Generate submission artifacts
        run: python -B scripts/generate_submission_artifacts.py

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: depth-guard-reports
          path: reports/
